[project]
name = "measync"
version = "0.1.0"
description = "Measurement synchronization — tiled live sources and a shared timeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "sounddevice>=0.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["measync*"]
